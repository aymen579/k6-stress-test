
name: Run Second K6 Server
on:
  workflow_dispatch:

jobs:
  stress_test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download and Run K6
        run: |
          ulimit -n 250000
          curl -L https://github.com | tar -xz
          ./k6-v0.51.0-linux-amd64/k6 run stress_part.js
