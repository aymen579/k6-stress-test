name: Run Advanced K6 Server
on:
  workflow_dispatch:

jobs:
  stress_test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup K6 Officially
        uses: grafana/setup-k6-action@v1

      - name: Run Advanced Script
        run: k6 run stress_part.js
